version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fitcorp-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-fitcorp}
      POSTGRES_USER: ${DB_USERNAME:-fitcorp_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fitcorp_secure_pass_2026}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-fitcorp_user} -d ${DB_NAME:-fitcorp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fitcorp-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fitcorp-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-fitcorp}
      DB_USERNAME: ${DB_USERNAME:-fitcorp_user}
      DB_PASSWORD: ${DB_PASSWORD:-fitcorp_secure_pass_2026}
      JWT_SECRET: ${JWT_SECRET:-4c5a782b3d9e8f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - fitcorp-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fitcorp-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - fitcorp-network

networks:
  fitcorp-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
