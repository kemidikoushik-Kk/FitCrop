spring:
  datasource:
    url: jdbc:h2:mem:fitcorp_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

fitcorp:
  jwt:
    secret: 4c5a782b3d9e8f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a
    access-expiration-ms: 3600000
    refresh-expiration-ms: 86400000

logging:
  level:
    com.fitcorp: WARN
    org.springframework: WARN
