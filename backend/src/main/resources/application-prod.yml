spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:mysql-ed8fd68-kemidikoushik1603-a3f8.h.aivencloud.com}:${DB_PORT:16612}/${DB_NAME:defaultdb}?sslMode=REQUIRED&useSSL=true&requireSSL=true&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:avnadmin}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

logging:
  level:
    com.fitcorp: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate: WARN
